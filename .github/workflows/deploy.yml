name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # There is no build step: the page is published as it is, with the API key filled in.
      - run: |
          mkdir site
          cp index.html favicon.ico magictranslate.svg site/
          sed -i "s/YOUR_API_KEY/$MAGIC_TRANSLATE_API_KEY/" site/index.html
        env:
          MAGIC_TRANSLATE_API_KEY: ${{ vars.MAGIC_TRANSLATE_API_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
